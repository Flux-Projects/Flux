<script>
(function(){
if(!window.Matter){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;top:40%;left:10%;right:10%;color:#fff;text-align:center;font-weight:700">Physics engine failed to load. Check your internet and reload.</p>');return}
var Engine=Matter.Engine,Bodies=Matter.Bodies,Body=Matter.Body,Composite=Matter.Composite,Events=Matter.Events;
var $=function(i){return document.getElementById(i)};
var W=960,H=540,GY=480,AX=170,AY=395,M=102,MAXPULL=100,K=0.15,G=0.2778;
var COL=['#ff5d73','#ffd23f','#3ddc97','#4cc9f0','#b388ff','#ff9f1c'];
var BIRD=['#ff5d73','#ffb703','#4cc9f0','#b388ff'];
var BC={w:'#c98a4a',g:'#9fe6ff',s:'#8791ac'};
var cv=$('c'),ctx=cv.getContext('2d');
var sc=1,ox=0,oy=0,dpr=1;
function fit(){dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;sc=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*sc)/2;oy=(cv.height-H*sc)/2}
addEventListener('resize',fit);fit();

var NLV=24,BUGP=2000,BLKP=150,BIRDP=800,lastGain=0,localPts=0,REPLAY=1,best={};
function makeLevel(n){
  var tw=n<3?1:n<10?2:3,fl=n<6?1:2,items=[],gap=tw===2?150:140,x0=tw===1?680:tw===2?600:540;
  var pk=n<8?'w':n<16?'g':'s';
  for(var i=0;i<tw;i++){
    var cx=x0+i*gap,pil=(n<8||i%2)?'w':(n<14?'g':'s');
    items.push([pil,cx-45,440,20,80],[pil,cx+45,440,20,80],[pk,cx,391,130,18]);
    if(fl>1&&(i%2===0||n>12))items.push(['w',cx-30,349,18,66],['w',cx+30,349,18,66],['g',cx,308,100,16],['b',cx,282]);
    else items.push(['b',cx,364]);
    if(n>=2&&i===0)items.push(['b',cx,462]);
  }
  var HP={w:22,g:9,s:40},T=0;items.forEach(function(it){T+=it[0]==='b'?30:HP[it[0]]});
  var slack=n<8?3:n<16?2:1;
  return{birds:Math.max(3,Math.min(7,Math.round(T/90)+slack)),tough:Math.round(T),items:items};
}
var LV=[];for(var li=0;li<NLV;li++)LV.push(makeLevel(li));
var clouds=[{x:100,y:70,s:1,v:.12},{x:420,y:120,s:.8,v:.08},{x:700,y:50,s:1.2,v:.1},{x:900,y:140,s:.7,v:.15},{x:-100,y:100,s:.9,v:.1}];
var fl=[];for(var i=0;i<40;i++)fl.push({x:-100+i*30+((i*37)%17),c:COL[i%6],p:i});

var engine,bodies=[],dead=[],parts=[],pops=[],trail=[],pts=[],cur=null,drag=false;
var level=0,total=3,birdsLeft=3,score=0,base=0,state='aim',t=0,flyT=0,shake=0,birdBody=null;

/* ---------- sound ---------- */
var ac=null;
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(type,f1,f2,d,v){try{if(!ac)return;var o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type;o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
var SFX={launch:function(){tone('triangle',520,110,.35,.18)},pop:function(){tone('square',260,880,.14,.1)},crack:function(){tone('sawtooth',180,60,.1,.08)},win:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone('triangle',f,f*1.01,.25,.15)},i*140)})}};
function sfx(n){SFX[n]&&SFX[n]()}

/* ---------- level ---------- */
function start(n,adv){
  level=n;score=0;lastGain=0;
  var L=LV[n];total=L.birds;birdsLeft=total;
  engine=Engine.create();engine.gravity.y=1;engine.positionIterations=12;engine.velocityIterations=10;
  bodies=[];dead=[];parts=[];pops=[];trail=[];pts=[];birdBody=null;shake=0;drag=false;
  var gr=Bodies.rectangle(W/2,GY+30,4000,60,{isStatic:true,friction:1});gr.k='ground';Composite.add(engine.world,gr);
  L.items.forEach(function(it){
    var k=it[0],b;
    if(k==='b'){b=Bodies.circle(it[1],it[2],18,{density:.0015,restitution:.2,friction:.5});Body.setInertia(b,Infinity);b.hp0=9}
    else{b=Bodies.rectangle(it[1],it[2],it[3],it[4],{density:{w:.0012,g:.001,s:.003}[k],friction:.7,restitution:.05});b.w=it[3];b.h=it[4];b.hp0={w:22,g:9,s:40}[k]}
    b.k=k;b.hp=b.hp0;b.flash=0;bodies.push(b);Composite.add(engine.world,b);
  });
  Events.on(engine,'collisionStart',function(e){
    if(state!=='fly')return;
    e.pairs.forEach(function(p){
      var a=p.bodyA,b=p.bodyB,sp=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);
      if(sp<2.5)return;hurt(a,b,sp);hurt(b,a,sp);
    });
  });
  for(var i=0;i<40;i++)Engine.update(engine,1000/60);
  state='aim';cur={x:AX,y:AY,c:BIRD[0]};$('ov').hidden=true;hud();
  $('ro').textContent='Drag the bird back, then let go.';
}
function hurt(x,o,sp){
  if(!x.hp0||x.dead)return;
  x.hp-=sp*Math.min(3,o.isStatic?3:o.mass/x.mass+.3);x.flash=1;
  if(x.hp<=0){x.dead=1;dead.push(x)}
}
function hud(){
  $('lv').textContent='Level '+(level+1);$('sc').textContent=score.toLocaleString();
  var h='';for(var i=0;i<total;i++)h+='<i style="background:'+BIRD[i%4]+';opacity:'+(i<total-birdsLeft?.25:1)+'"></i>';
  $('bd').innerHTML=h;
}

/* ---------- input ---------- */
function P(e){return{x:(e.clientX*dpr-ox)/sc,y:(e.clientY*dpr-oy)/sc}}
function move(e){
  var p=P(e),dx=p.x-AX,dy=p.y-AY,d=Math.hypot(dx,dy);
  if(d>MAXPULL){dx*=MAXPULL/d;dy*=MAXPULL/d}
  cur.x=AX+dx;cur.y=Math.min(AY+dy,GY-18);
  var vx=(AX-cur.x)*K,vy=(AY-cur.y)*K,x=cur.x,y=cur.y;pts=[];
  for(var i=0;i<60;i++){vy+=G;x+=vx;y+=vy;if(y>GY)break;if(i%3===2)pts.push([x,y])}
  var th=Math.atan2(cur.y-AY,AX-cur.x),v=Math.hypot(AX-cur.x,AY-cur.y)*K*60/M,R=th>0?v*v*Math.sin(2*th)/9.8:0;
  $('ro').innerHTML='θ = '+(th*180/Math.PI).toFixed(0)+'° &nbsp; v = '+v.toFixed(1)+' m/s<br>R = v²·sin2θ / g = '+R.toFixed(1)+' m';
}
cv.addEventListener('pointerdown',function(e){
  unlock();if(state!=='aim'||!cur)return;
  var p=P(e);if(Math.hypot(p.x-AX,p.y-AY)<90){drag=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}move(e)}
});
cv.addEventListener('pointermove',function(e){if(drag)move(e)});
function release(){
  if(!drag)return;drag=false;pts=[];
  if(Math.hypot(cur.x-AX,cur.y-AY)>25)launch();else{cur.x=AX;cur.y=AY}
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

function launch(){
  var dx=AX-cur.x,dy=AY-cur.y;
  var b=Bodies.circle(cur.x,cur.y,16,{density:.004,restitution:.35,friction:.6,frictionAir:0});
  b.k='bird';b.c=cur.c;Body.setVelocity(b,{x:dx*K,y:dy*K});
  Composite.add(engine.world,b);bodies.push(b);birdBody=b;
  state='fly';flyT=0;birdsLeft--;cur=null;hud();sfx('launch');
}
function next(){
  if(birdBody){Composite.remove(engine.world,birdBody);bodies=bodies.filter(function(b){return b!==birdBody});burst(birdBody.position.x,birdBody.position.y,10,['#fff',birdBody.c],3);birdBody=null}
  cur={x:AX,y:AY,c:BIRD[(total-birdsLeft)%4]};state='aim';
}
function win(){
  if(state==='over')return;state='over';score+=birdsLeft*BIRDP;var bb=B(),first=bb[level]==null,gain=Math.round(score*(first?1:REPLAY));lastGain=gain;bb[level]=Math.max(bb[level]||0,score);if(window.Wallet&&Wallet.user)Wallet.add(gain,bb);else{localPts+=gain;saveBest()}hud();sfx('win');
  for(var i=0;i<120;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*260,vx:Math.random()*2-1,vy:Math.random()*2,r:Math.random()*4+3,c:COL[i%6],life:1,d:.005,rot:0,vr:Math.random()*.3-.15,sq:true});
  setTimeout(function(){show(true)},1100);
}
function lose(){if(state==='over')return;state='over';setTimeout(function(){show(false)},500)}
function show(w){
  var s=Math.min(3,birdsLeft+1);
  $('ot').textContent=w?'Level cleared!':'Out of birds';
  $('os').textContent=w?'★'.repeat(s)+'☆'.repeat(3-s):'';
  $('op').textContent='Score '+score.toLocaleString()+(w&&lastGain?'  ·  +'+lastGain.toLocaleString()+' pts':'')+(w&&!(window.Wallet&&Wallet.user)?'  ·  offline, not counted for ₹':'');
  $('b1').textContent=w?(level<LV.length-1?'Next level':'Levels'):'Try again';
  $('b2').textContent='Levels';$('b2').style.display='';
  $('b1').onclick=function(){if(w){if(level<LV.length-1)start(level+1,false);else{$('ov').hidden=true;openLevels()}}else start(level,false)};
  $('b2').onclick=function(){$('ov').hidden=true;openLevels()};
  $('ov').hidden=false;
}
$('rs').addEventListener('click',function(){start(level,false)});

/* ---------- fx ---------- */
function burst(x,y,n,cols,sp){
  for(var i=0;i<n;i++){var a=Math.random()*6.283,s=(Math.random()*.7+.3)*sp;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:Math.random()*4+2,c:cols[i%cols.length],life:1,d:.018,rot:Math.random()*6,vr:Math.random()*.4-.2,sq:Math.random()<.5})}
}
function step(){
  t++;Engine.update(engine,1000/60);
  dead.splice(0).forEach(function(b){
    Composite.remove(engine.world,b);bodies=bodies.filter(function(x){return x!==b});
    var bug=b.k==='b',pt=bug?BUGP:BLKP;score+=pt;
    pops.push({x:b.position.x,y:b.position.y-12,t:'+'+pt,life:1});
    burst(b.position.x,b.position.y,bug?30:12,bug?['#8be36b','#4fcf5a','#ffd23f','#fff']:[BC[b.k],'#fff'],bug?7:4);
    shake=bug?9:3;sfx(bug?'pop':'crack');hud();
  });
  bodies=bodies.filter(function(b){
    if(!b.isStatic&&(b.position.x>W+300||b.position.x<-300||b.position.y>H+300)){Composite.remove(engine.world,b);return false}
    if(b.flash>0)b.flash-=.08;return true;
  });
  clouds.forEach(function(c){c.x+=c.v;if(c.x>W+150)c.x=-150});
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.99;p.rot+=p.vr;p.life-=p.d});parts=parts.filter(function(p){return p.life>0});
  pops.forEach(function(p){p.y-=.7;p.life-=.016});pops=pops.filter(function(p){return p.life>0});
  trail.forEach(function(p){p.l-=.03});trail=trail.filter(function(p){return p.l>0});
  shake*=.88;
  if(state==='fly'){
    flyT++;
    if(birdBody&&t%2===0&&flyT<300)trail.push({x:birdBody.position.x,y:birdBody.position.y,l:1,c:birdBody.c});
    var left=bodies.filter(function(b){return b.k==='b'}).length;
    var calm=bodies.every(function(b){return b.isStatic||b.speed<.3});
    if(left===0&&flyT>80){win();return}
    if(flyT>70&&((calm&&flyT>100)||flyT>700)){if(birdsLeft>0)next();else lose()}
  }
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function hills(base,amp,f,ph,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-600,GY);for(var x=-600;x<=1560;x+=24)ctx.lineTo(x,base+Math.sin(x*f+ph)*amp);ctx.lineTo(1560,GY);ctx.closePath();ctx.fill()}
function sun(){
  var x=830,y=85;ctx.save();ctx.translate(x,y);ctx.rotate(t*.004);ctx.fillStyle='rgba(255,236,140,.35)';
  for(var i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(30,-8);ctx.lineTo(95,0);ctx.lineTo(30,8);ctx.fill()}
  ctx.restore();var g=ctx.createRadialGradient(x,y,5,x,y,38);g.addColorStop(0,'#fffbd0');g.addColorStop(1,'#ffd23f');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,36,0,7);ctx.fill();
}
function cloud(c){ctx.fillStyle='rgba(255,255,255,.92)';[[0,0,30],[30,-10,36],[64,0,28],[32,8,30]].forEach(function(a){ctx.beginPath();ctx.arc(c.x+a[0]*c.s,c.y+a[1]*c.s,a[2]*c.s,0,7);ctx.fill()})}

  ctx.fillStyle='#8a5a35';ctx.fillRect(-1000,GY,3000,200);
  ctx.fillStyle='#6f4527';for(var x=-100;x<1100;x+=70)ctx.fillRect(x,GY+30+(Math.floor(x/70)%3+3)%3*18,34,6);
  ctx.fillStyle='#43c15f';ctx.fillRect(-1000,GY,3000,16);ctx.fillStyle='#8cf09a';ctx.fillRect(-1000,GY,3000,5);
  fl.forEach(function(f){var s=Math.sin(t*.05+f.p)*2;ctx.strokeStyle='#2c9a47';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x,GY+2);ctx.lineTo(f.x+s,GY-10);ctx.stroke();ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x+s,GY-12,4,0,7);ctx.fill();ctx.fillStyle='#fff6c7';ctx.beginPath();ctx.arc(f.x+s,GY-12,1.6,0,7);ctx.fill()});
}
function sling(front){
  ctx.lineCap='round';ctx.strokeStyle=front?'#8a5128':'#5a3318';ctx.lineWidth=front?13:11;ctx.beginPath();
  if(front){ctx.moveTo(AX,GY);ctx.lineTo(AX,AY+28);ctx.moveTo(AX,AY+28);ctx.lineTo(AX+15,AY-6)}
  else{ctx.moveTo(AX-1,AY+28);ctx.lineTo(AX-15,AY-6)}
  ctx.stroke();
}
function band(sx){
  ctx.strokeStyle='#2b140a';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,AY-4);
  if(cur)ctx.lineTo(cur.x,cur.y);else ctx.lineTo(AX,AY+2);ctx.stroke();
}
function bird(x,y,c,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(a||0);
  ctx.save();ctx.rotate(t*.05);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,23,7.5,0,0,7);ctx.stroke();ctx.restore();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();
  var g=ctx.createRadialGradient(-5,-6,1,0,0,16);g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(.4,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.25)');
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(-5,-25);ctx.lineTo(1,-21);ctx.lineTo(4,-29);ctx.lineTo(5,-15);ctx.fill();
  [-5.5,5.5].forEach(function(dx){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(dx,-2,4.6,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(dx+1.2,-1.5,2.2,0,7);ctx.fill()});
  ctx.strokeStyle='#2a1a1a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-11,-10);ctx.lineTo(-2,-5.5);ctx.moveTo(11,-10);ctx.lineTo(2,-5.5);ctx.stroke();
  ctx.restore();
}
function bug(b){
  var x=b.position.x,y=b.position.y;ctx.save();ctx.translate(x,y);
  ctx.strokeStyle='#1f7a35';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-7,-14);ctx.quadraticCurveTo(-12,-26,-17,-26);ctx.moveTo(7,-14);ctx.quadraticCurveTo(12,-26,17,-26);ctx.stroke();
  ctx.fillStyle='#ff5d73';[-17,17].forEach(function(dx){ctx.beginPath();ctx.arc(dx,-26,3.2,0,7);ctx.fill()});
  var g=ctx.createRadialGradient(-5,-6,2,0,0,19);g.addColorStop(0,'#d4f9a8');g.addColorStop(.5,'#58d35f');g.addColorStop(1,'#26923d');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();ctx.strokeStyle='#1f7a35';ctx.lineWidth=2;ctx.stroke();
  var w=Math.sin(t*.08+x)*1;
  [-6,6].forEach(function(dx){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(dx,-3,5.5,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(dx+w,-2,2.4,0,7);ctx.fill()});
  ctx.fillStyle='#2a1a1a';ctx.beginPath();ctx.arc(0,6,6,0,Math.PI);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-4,6);ctx.lineTo(-2.5,10);ctx.lineTo(-1,6);ctx.moveTo(1,6);ctx.lineTo(2.5,10);ctx.lineTo(4,6);ctx.fill();
  if(b.flash>0){ctx.fillStyle='rgba(255,255,255,'+(b.flash*.7)+')';ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill()}
  ctx.restore();
}
function block(b){
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  var w=b.w,h=b.h,k=b.k;
  var Pl={w:['#e0a866','#b97a3c','#7a4a22'],g:['rgba(190,240,255,.75)','rgba(120,210,255,.55)','rgba(255,255,255,.95)'],s:['#a9b2c9','#717c97','#454d66']}[k];
  var g=ctx.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,Pl[0]);g.addColorStop(1,Pl[1]);
  ctx.fillStyle=g;ctx.strokeStyle=Pl[2];ctx.lineWidth=2;rr(-w/2,-h/2,w,h,3);ctx.fill();ctx.stroke();
  if(k==='w'){ctx.strokeStyle='rgba(90,50,20,.35)';ctx.lineWidth=1.2;ctx.beginPath();
    if(w>h){ctx.moveTo(-w/2+4,-h/6);ctx.lineTo(w/2-4,-h/6);ctx.moveTo(-w/2+4,h/5);ctx.lineTo(w/2-4,h/5)}
    else{ctx.moveTo(-w/6,-h/2+4);ctx.lineTo(-w/6,h/2-4);ctx.moveTo(w/5,-h/2+4);ctx.lineTo(w/5,h/2-4)}ctx.stroke()}
  if(k==='g'){var m=Math.min(w,h)/2-3;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-w/2+5,-h/2+5+m);ctx.lineTo(-w/2+5+m,-h/2+5);ctx.stroke()}
  if(k==='s'){ctx.fillStyle='rgba(255,255,255,.35)';[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(s){ctx.beginPath();ctx.arc(s[0]*(w/2-5),s[1]*(h/2-5),2,0,7);ctx.fill()})}
  if(b.hp<b.hp0*.55){ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-w*.2,-h/2);ctx.lineTo(-w*.05,-h*.1);ctx.lineTo(-w*.25,h*.15);ctx.lineTo(0,h/2);ctx.stroke()}
  if(b.flash>0){ctx.fillStyle='rgba(255,255,255,'+(b.flash*.6)+')';rr(-w/2,-h/2,w,h,3);ctx.fill()}
  ctx.restore();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(sc,0,0,sc,ox,oy);
  ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  var g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#2f9bff');g.addColorStop(.6,'#8fd8ff');g.addColorStop(1,'#ffeab0');
  ctx.fillStyle=g;ctx.fillRect(-1500,-1500,4000,1500+GY);
  sun();clouds.forEach(cloud);hills(385,35,.006,1,'#8fe3a0');hills(425,25,.011,3,'#5fcf7b');ground();
  sling(0);band(AX-15);
  bodies.forEach(function(b){if(b.k==='b')bug(b);else if(b.k==='bird')bird(b.position.x,b.position.y,b.c,b.angle);else if(b.k!=='ground')block(b)});
  trail.forEach(function(p){ctx.globalAlpha=p.l*.6;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5*p.l+1,0,7);ctx.fill()});ctx.globalAlpha=1;
  pts.forEach(function(p,i){ctx.fillStyle='rgba(255,255,255,'+(.95-i*.04)+')';ctx.beginPath();ctx.arc(p[0],p[1],Math.max(1.5,5-i*.15),0,7);ctx.fill()});
  if(cur)bird(cur.x,cur.y,cur.c,0);
  band(AX+15);sling(1);
  parts.forEach(function(p){ctx.save();ctx.globalAlpha=Math.min(1,p.life*1.5);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;if(p.sq)ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{ctx.beginPath();ctx.arc(0,0,p.r*.7,0,7);ctx.fill()}ctx.restore()});
  ctx.textAlign='center';ctx.font='800 22px system-ui,sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.fillStyle='#fff';
  pops.forEach(function(p){ctx.globalAlpha=p.life;ctx.strokeText(p.t,p.x,p.y);ctx.fillText(p.t,p.x,p.y)});ctx.globalAlpha=1;
}

function B(){return window.Wallet&&Wallet.user?Wallet.best:best}
function saveBest(){try{localStorage.setItem('flux_best',JSON.stringify(best));localStorage.setItem('flux_pts',localPts)}catch(e){}}
try{best=JSON.parse(localStorage.getItem('flux_best')||'{}');localPts=+localStorage.getItem('flux_pts')||0}catch(e){}
function openLevels(){
  var bb=B(),p=0,h='',Wl=window.Wallet;
  p=Wl&&Wl.user?Wl.points:localPts;
  $('lt').textContent=p.toLocaleString()+' pts = ₹'+(p/100000).toFixed(2);
  $('lbar').style.width=Math.min(100,p/1000)+'%';
  $('lu').textContent=Wl&&Wl.user?'No signup needed: points save automatically on this device.':'Offline mode: points are practice only.';
  
  for(var i=0;i<LV.length;i++){var ok=i===0||bb[i-1]!=null;
    h+='<button class="lvb t'+(i<8?0:i<16?1:2)+(ok?'':' lock')+'" data-i="'+i+'"'+(ok?'':' disabled')+'>'+(ok?i+1:'🔒')+'<small>🐦 '+LV[i].birds+'</small></button>';
  }
  $('lg').innerHTML=h;$('lp').hidden=false;
}
function openWallet(){
  var Wl=window.Wallet,m=$('wm');
  if(!Wl||!Wl.ok)m.textContent='Rewards server is not connected yet (Firebase config missing).';
  else if(!Wl.user)m.textContent='Connecting to rewards server, try again in a moment.';
  else{var a=Wl.points-Wl.withdrawn;m.textContent='Available: '+a.toLocaleString()+' pts. You can withdraw ₹'+Math.floor(a/100000)+' now (₹1 = 1,00,000 pts).'}
  $('wp').hidden=false;
}
$('mn').onclick=openLevels;$('lwd').onclick=openWallet;$('wx').onclick=function(){$('wp').hidden=true};

$('lg').onclick=function(e){var b=e.target.closest('button');if(b&&!b.disabled){$('lp').hidden=true;start(+b.dataset.i,false)}};
$('wgo').onclick=function(){
  if(!window.Wallet||!Wallet.user){openWallet();return}
  Wallet.withdraw($('upi').value).then(function(m){$('wm').textContent=m}).catch(function(e){$('wm').textContent=e.message});
};
if(window.Wallet)Wallet.onChange=function(){if(!$('lp').hidden)openLevels();if(!$('wp').hidden)openWallet()};

var last=0,acc=0;
function loop(ts){var d=Math.min(50,ts-last);last=ts;acc+=d;while(acc>=16.667){step();acc-=16.667}draw();requestAnimationFrame(loop)}
openLevels();start(0,false);requestAnimationFrame(loop);
})();
</script>
